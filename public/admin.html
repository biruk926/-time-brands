<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIME BRAND Admin</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-body">
    <div id="admin-login" class="admin-login">
        <div class="admin-login-box">
            <h1>TIME <span>BRAND</span> Admin</h1>
            <form id="admin-login-form">
                <label for="admin-password">Admin Password</label>
                <input id="admin-password" type="password" required autocomplete="current-password" />
                <div id="admin-login-error" class="error-message" role="alert"></div>
                <button type="submit" class="btn btn-gold">Login</button>
            </form>
        </div>
    </div>

    <div id="admin-dashboard" hidden>
        <header class="site-header admin-header">
            <div class="container header-inner">
                <span class="logo">TIME <span>BRAND</span> Admin</span>
                <button id="admin-logout" class="btn btn-outline-gold">Logout</button>
            </div>
        </header>

        <div class="admin-layout">
            <nav class="admin-tabs" aria-label="Admin sections">
                <button class="admin-tab active" data-tab="overview">Overview</button>
                <button class="admin-tab" data-tab="orders">Orders</button>
                <button class="admin-tab" data-tab="products">Products</button>
                <button class="admin-tab" data-tab="customers">Customers</button>
                <button class="admin-tab" data-tab="chat">Chat</button>
                <button class="admin-tab" data-tab="settings">Settings</button>
            </nav>

            <main class="admin-content">
                <section id="tab-overview" class="tab-panel active">
                    <h2>Overview</h2>
                    <div id="overview-stats" class="stats-grid"></div>
                </section>

                <section id="tab-orders" class="tab-panel">
                    <h2>Orders</h2>
                    <div id="admin-orders-list" class="admin-list"></div>
                </section>

                <section id="tab-products" class="tab-panel">
                    <h2>Products</h2>
                    <button id="add-product-btn" class="btn btn-gold">Add Product</button>
                    <div id="admin-products-list" class="admin-list"></div>
                </section>

                <section id="tab-customers" class="tab-panel">
                    <h2>Customers</h2>
                    <div id="admin-customers-list" class="admin-list"></div>
                </section>

                <section id="tab-chat" class="tab-panel">
                    <h2>Customer Conversations</h2>
                    <div class="chat-admin-layout">
                        <div id="conversation-list" class="conversation-list"></div>
                        <div class="chat-window">
                            <div id="admin-chat-messages" class="chat-messages" aria-live="polite"></div>
                            <form id="admin-chat-form" class="chat-form">
                                <label for="admin-chat-input" class="sr-only">Message</label>
                                <input id="admin-chat-input" type="text" placeholder="Type your reply..." required />
                                <button type="submit" class="btn btn-gold">Send</button>
                            </form>
                        </div>
                    </div>
                </section>

                <section id="tab-settings" class="tab-panel">
                    <h2>Settings</h2>
                    <p>Environment information and status.</p>
                    <div id="admin-status"></div>
                </section>
            </main>
        </div>
    </div>

    <!-- Reject Modal -->
    <div id="reject-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="reject-title">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="reject-title">Reject Order</h3>
                <button class="close-modal" data-close="reject-modal" aria-label="Close reject modal">×</button>
            </div>
            <form id="reject-form">
                <label for="reject-reason">Rejection Reason</label>
                <textarea id="reject-reason" rows="3" required placeholder="Payment could not be verified"></textarea>
                <input id="reject-order-id" type="hidden" />
                <div class="modal-actions">
                    <button type="submit" class="btn btn-danger">Reject Order</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
